<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Physics Curtain</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        canvas {
            display: block;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            transition: opacity 0.5s ease;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #start-btn {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #3b82f6;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        #status-msg {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.7;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none;
        }

        #debug-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            z-index: 50;
            text-shadow: 1px 1px 2px black;
        }

        #controls-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            align-items: flex-end;
            transition: opacity 0.3s, pointer-events 0.3s;
        }

        .control-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        #media-upload {
            display: none;
        }

        .zoom-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        input[type=range] {
            width: 100px;
            accent-color: #3b82f6;
        }

        #hide-ui-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 18px;
            cursor: pointer;
            z-index: 101;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ui-hidden #controls-panel,
        .ui-hidden #debug-info {
            opacity: 0;
            pointer-events: none;
        }

        .ui-hidden #hide-ui-btn {
            opacity: 0.3;
        }

        .ui-hidden #hide-ui-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>Physics Curtain</h1>
        <p>Interact with a realistic cloth using your hands or touch.</p>
        <button id="start-btn">Start Experience</button>
        <p id="status-msg">Camera access is required for hand tracking.</p>
    </div>

    <div id="debug-info">Initializing...</div>

    <button id="hide-ui-btn">👁️</button>

    <div id="controls-panel">
        <div class="zoom-container" id="zoom-container" style="display: none;">
            <label for="zoom-slider">Zoom</label>
            <input type="range" id="zoom-slider" min="0.5" max="3" step="0.05" value="1">
        </div>
        <button class="control-btn" id="reset-btn" style="display: none;">Reset Curtains ⬇️</button>
        <button class="control-btn" id="flip-cam-btn">Flip Camera 🔄</button>
        <label class="control-btn" for="media-upload">Upload Media 📁</label>
        <input type="file" id="media-upload" accept="image/*,video/*" multiple>
    </div>

    <script>
        // --- Media Upload Variables ---
        let curtains = []; // Array to hold multiple curtain objects

        // --- Global States ---
        let mediaZoom = 1.0;
        let isUIHidden = false;
        let cameraFacingMode = 'user';

        // --- Physics Engine Variables ---
        const GRAVITY = 0.08;
        const FRICTION = 0.94;

        // --- Interaction Variables ---
        let activeHands = [];
        let grabbedNodes = [];
        let mouseGrabbedNode = null;
        let interactionRadius = 150; // Larger radius for easier grabbing
        let isCurtainThrown = false; // Tracks if the curtain is thrown over the top
        let particles = [];

        function spawnParticles(x, y, w, h) {
            for(let i=0; i<50; i++) {
                particles.push({
                    x: x + random(w),
                    y: y + random(h),
                    vx: random(-4, 4),
                    vy: random(-6, 2),
                    size: random(3, 8),
                    life: 255
                });
            }
        }

        // --- MediaPipe Setup ---
        let hands;
        let camera;
        let videoElement;
        let isCameraReady = false;

        function setup() {
            createCanvas(windowWidth, windowHeight);

            videoElement = document.createElement('video');
            videoElement.setAttribute('playsinline', '');
            videoElement.style.display = 'none';
            document.body.appendChild(videoElement);

            const startBtn = document.getElementById('start-btn');
            startBtn.addEventListener('click', () => {
                document.getElementById('ui-overlay').classList.add('hidden');
                initMediaPipe();
            });

            // Handle Media Upload
        const fileInput = document.getElementById('media-upload');
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).slice(0, 9); // Max 9 files for performance
            if (files.length === 0) return;

            document.getElementById('zoom-container').style.display = 'flex';
            curtains = []; // Clear existing curtains

            let loadPromises = files.map(file => {
                return new Promise((resolve) => {
                    const url = URL.createObjectURL(file);
                    let curtain = {
                        mediaType: file.type.startsWith('video/') ? 'video' : 'image',
                        points: [],
                        sticks: [],
                        perimeter: [],
                        isThrown: false
                    };

                    if (curtain.mediaType === 'video') {
                        let vid = document.createElement('video');
                        vid.loop = true; vid.muted = true; vid.playsInline = true;
                        vid.src = url;
                        vid.onloadedmetadata = () => {
                            curtain.mediaSource = vid;
                            curtain.sourceW = vid.videoWidth;
                            curtain.sourceH = vid.videoHeight;
                            vid.play();
                            resolve(curtain);
                        };
                    } else {
                        let img = new Image();
                        img.onload = () => {
                            curtain.mediaSource = img;
                            curtain.sourceW = img.naturalWidth;
                            curtain.sourceH = img.naturalHeight;
                            resolve(curtain);
                        };
                        img.src = url;
                    }
                });
            });

            curtains = await Promise.all(loadPromises);
            updateMediaDimensions();
        });

            // UI Controls Events
            document.getElementById('zoom-slider').addEventListener('input', (e) => {
                mediaZoom = parseFloat(e.target.value);
            });

            document.getElementById('hide-ui-btn').addEventListener('click', () => {
                isUIHidden = !isUIHidden;
                if (isUIHidden) {
                    document.body.classList.add('ui-hidden');
                    document.getElementById('hide-ui-btn').innerText = '👁️‍🗨️';
                } else {
                    document.body.classList.remove('ui-hidden');
                    document.getElementById('hide-ui-btn').innerText = '👁️';
                }
            });

            document.getElementById('flip-cam-btn').addEventListener('click', async () => {
                cameraFacingMode = cameraFacingMode === 'user' ? 'environment' : 'user';
                if (isCameraReady && camera) {
                    await camera.stop();
                    initMediaPipe(); // Restart with new facing mode
                }
            });

            document.getElementById('reset-btn').addEventListener('click', () => {
                for(let c of curtains) {
                    c.isThrown = false;
                    c.isFullyRevealed = false;
                    for (let y = 0; y < c.rows; y++) {
                        for (let x = 0; x < c.cols; x++) {
                            let p = c.points[y * c.cols + x];
                            p.x = p.origBaseX;
                            p.y = p.origBaseY;
                            p.oldX = p.origBaseX;
                            p.oldY = p.origBaseY;
                            p.pinned = (y === 0);
                        }
                    }
                }
                document.getElementById('reset-btn').style.display = 'none';
            });

            updateMediaDimensions();
            document.getElementById('debug-info').innerText = "Ready. Click Start.";
        }

        function updateMediaDimensions() {
            if (curtains.length === 0) return;

            let count = curtains.length;
            let cols = Math.ceil(Math.sqrt(count));
            let rows = Math.ceil(count / cols);

            let cellW = width / cols;
            let cellH = height / rows;

            // Maximum possible screen coverage with near-zero padding
            let padX = cellW * 0.002;
            let maxW = cellW - padX * 2;
            // Utilize 98% of vertical cell height
            let maxH = cellH * 0.98;

            // Dynamic LOD based on count to ensure 60FPS
            let lodCols = count === 1 ? 38 : (count <= 4 ? 20 : 12);
            let lodRows = count === 1 ? 35 : (count <= 4 ? 18 : 11);

            for (let i = 0; i < count; i++) {
                let c = curtains[i];
                let col = i % cols;
                let row = Math.floor(i / cols);

                let mediaAspect = c.sourceW / c.sourceH;
                let maxAspect = maxW / maxH;

                if (mediaAspect > maxAspect) {
                    c.w = maxW;
                    c.h = maxW / mediaAspect;
                } else {
                    c.h = maxH;
                    c.w = maxH * mediaAspect;
                }

                // Center in cell, minimal shift for high-tension cloth
                let cx = col * cellW + cellW / 2;
                let cy = row * cellH + cellH / 2 - (c.h * 0.02);
                let startX = cx - c.w / 2;
                let startY = cy - c.h / 2;

                c.baseX = startX;
                c.baseY = startY;
                c.cols = lodCols;
                c.rows = lodRows;
                c.spacingX = c.w / (lodCols - 1);
                c.spacingY = (c.h * 1.04) / (lodRows - 1); // 4% slack for maximum density

                initCloth(c);
            }
        }

        function initCloth(c) {
            c.points = [];
            c.sticks = [];
            c.isThrown = false;
            c.isFullyRevealed = false;

            for (let y = 0; y < c.rows; y++) {
                for (let x = 0; x < c.cols; x++) {
                    let px = c.baseX + x * c.spacingX;
                    let py = c.baseY + y * c.spacingY;
                    c.points.push({
                        x: px, y: py, oldX: px, oldY: py,
                        origBaseX: px, origBaseY: py,
                        randomOffsetX: random(-20, 20),
                        randomOffsetY: random(-35, 5),
                        pinned: (y === 0),
                        wasGrabbed: false
                    });
                }
            }

            for (let y = 0; y < c.rows; y++) {
                for (let x = 0; x < c.cols; x++) {
                    if (x < c.cols - 1) {
                        c.sticks.push({
                            p1: c.points[y * c.cols + x],
                            p2: c.points[y * c.cols + x + 1],
                            len: c.spacingX
                        });
                    }
                    if (y < c.rows - 1) {
                        c.sticks.push({
                            p1: c.points[y * c.cols + x],
                            p2: c.points[(y + 1) * c.cols + x],
                            len: c.spacingY
                        });
                    }
                }
            }
        }

        async function initMediaPipe() {
            document.getElementById('debug-info').innerText = "Starting Camera...";

            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 2, // Support both left and right hands simultaneously
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandResults);

            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480,
                facingMode: cameraFacingMode
            });

            try {
                await camera.start();
                isCameraReady = true;
                document.getElementById('debug-info').innerText = "System Active";
            } catch (err) {
                console.error(err);
                document.getElementById('debug-info').innerText = "Camera Error: " + err.message;
            }
        }

        function onHandResults(results) {
            let newActiveHands = [];
            if (results.multiHandLandmarks) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];

                    const pinchDistance = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);

                    const midX = (indexTip.x + thumbTip.x) / 2;
                    const midY = (indexTip.y + thumbTip.y) / 2;

                    const screenX = (1 - midX) * width;
                    const screenY = midY * height;

                    // Find the closest previous hand to maintain state (fixes hand-swapping drop issue)
                    let prevHand = null;
                    let minD = Infinity;
                    for (let ph of activeHands) {
                        let d = Math.hypot(ph.x - screenX, ph.y - screenY);
                        if (d < 200 && d < minD) { // 200px tracking radius between frames
                            minD = d;
                            prevHand = ph;
                        }
                    }

                    let wasPinching = prevHand ? prevHand.isPinching : false;

                    // Reduced hysteresis: easier to release, less sticky
                    const pinchThreshold = wasPinching ? 0.08 : 0.05;
                    const isPinching = pinchDistance < pinchThreshold;

                    newActiveHands.push({
                        x: screenX,
                        y: screenY,
                        isPinching: isPinching,
                        grabbedNode: prevHand ? prevHand.grabbedNode : null
                    });
                }
            }
            activeHands = newActiveHands;
        }

        function drawCoverMediaRect(img, imgW, imgH, rx, ry, rw, rh) {
            let imgAspect = imgW / imgH;
            let rectAspect = rw / rh;
            let sx, sy, sw, sh;

            if (imgAspect > rectAspect) {
                // Image is wider than rect
                sh = imgH;
                sw = imgH * rectAspect;
                sx = (imgW - sw) / 2;
                sy = 0;
            } else {
                // Image is taller than rect
                sw = imgW;
                sh = imgW / rectAspect;
                sx = 0;
                sy = (imgH - sh) / 2;
            }

            // Apply zoom
            let zoomSw = sw / mediaZoom;
            let zoomSh = sh / mediaZoom;
            let zoomSx = sx + (sw - zoomSw) / 2;
            let zoomSy = sy + (sh - zoomSh) / 2;

            // Constrain source coordinates to avoid out-of-bounds drawing
            zoomSx = Math.max(0, Math.min(zoomSx, imgW - zoomSw));
            zoomSy = Math.max(0, Math.min(zoomSy, imgH - zoomSh));

            // Draw with object-fit: cover logic
            drawingContext.drawImage(img, zoomSx, zoomSy, zoomSw, zoomSh, rx, ry, rw, rh);
        }

        function drawCameraFeed() {
            if (isCameraReady && videoElement.videoWidth > 0) {
                push();
                if (cameraFacingMode === 'user') {
                    translate(width, 0);
                    scale(-1, 1); // Mirror front camera
                }
                let aspect = videoElement.videoWidth / videoElement.videoHeight;
                let vh = height;
                let vw = height * aspect;
                if (vw < width) {
                    vw = width;
                    vh = width / aspect;
                }
                drawingContext.drawImage(videoElement, (width - vw) / 2, (height - vh) / 2, vw, vh);
                pop();
            }
        }

        function calculatePerimeter(c) {
            c.perimeter = [];
            for (let x = 0; x < c.cols; x++) c.perimeter.push(c.points[x]);
            for (let y = 1; y < c.rows; y++) c.perimeter.push(c.points[y * c.cols + (c.cols - 1)]);
            for (let x = c.cols - 2; x >= 0; x--) c.perimeter.push(c.points[(c.rows - 1) * c.cols + x]);
            for (let y = c.rows - 2; y > 0; y--) c.perimeter.push(c.points[y * c.cols]);
        }

        function draw() {
            background(0);
            updatePhysics();
            drawCameraFeed(); // 1. Base Layer: Global Camera Feed

            if (curtains.length === 0) {
                // Dark placeholder if no media is uploaded yet
                let fixedW = width * 0.7; let fixedH = height * 0.5;
                let fixedX = (width - fixedW) / 2; let fixedY = 100;
                push();
                fill(20, 20, 20, 200); noStroke();
                rect(fixedX, fixedY, fixedW, fixedH);
                fill(255, 255, 255, 150); textAlign(CENTER, CENTER); textSize(16);
                text("Upload Media (Up to 9)\n(Revealed under the invisible curtains)", fixedX + fixedW/2, fixedY + fixedH/2);
                pop();
                return;
            }

            for (let c of curtains) {
                if (c.isFullyRevealed) continue;

                calculatePerimeter(c);

                // 2. Middle Layer: The Uploaded Media
                if (c.mediaType === 'image' && c.mediaSource.complete) {
                    drawCoverMediaRect(c.mediaSource, c.sourceW, c.sourceH, c.baseX, c.baseY, c.w, c.h);
                } else if (c.mediaType === 'video' && c.mediaSource.readyState >= 2) {
                    drawCoverMediaRect(c.mediaSource, c.sourceW, c.sourceH, c.baseX, c.baseY, c.w, c.h);
                }

                // 3. Top Layer: The Invisible Cloth (Clipping mask)
                push();
                drawingContext.beginPath();
                if (c.perimeter.length > 0) {
                    drawingContext.moveTo(c.perimeter[0].x, c.perimeter[0].y);
                    for (let i = 1; i < c.perimeter.length; i++) {
                        drawingContext.lineTo(c.perimeter[i].x, c.perimeter[i].y);
                    }
                    drawingContext.closePath();
                    drawingContext.clip();
                }
                drawCameraFeed();
                pop();

                // 4. Draw the dynamic material visuals
                renderClothVisuals(c);
            }

            // Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // gravity
                p.life -= 4;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    fill(255, 215, 0, p.life);
                    noStroke();
                    circle(p.x, p.y, p.size);
                }
            }

            renderInteraction();
        }

        function updatePhysics() {
            grabbedNodes = [];
            let windX = (noise(frameCount * 0.005) - 0.5) * 0.08;
            let windY = (noise(frameCount * 0.005 + 1000) - 0.5) * 0.08;

            // Collect all points across all curtains for interaction checks
            let allPoints = [];
            for (let c of curtains) allPoints.push(...c.points);

            if (mouseIsPressed) {
                if (!mouseGrabbedNode) {
                    let closestDistSq = interactionRadius * interactionRadius;
                    for (let p of allPoints) {
                        let dSq = (mouseX - p.x)**2 + (mouseY - p.y)**2;
                        if (dSq < closestDistSq && !p.pinned) {
                            closestDistSq = dSq;
                            mouseGrabbedNode = p;
                        }
                    }
                }
                if (mouseGrabbedNode) {
                    mouseGrabbedNode.oldX = mouseGrabbedNode.x;
                    mouseGrabbedNode.oldY = mouseGrabbedNode.y;
                    mouseGrabbedNode.x = mouseX;
                    mouseGrabbedNode.y = mouseY;
                    grabbedNodes.push(mouseGrabbedNode);
                }
            } else {
                mouseGrabbedNode = null;
            }

            for (let h of activeHands) {
                if (h.isPinching) {
                    if (!h.grabbedNode) {
                        let closestDistSq = interactionRadius * interactionRadius;
                        let target = null;
                        for (let p of allPoints) {
                            let dSq = (h.x - p.x)**2 + (h.y - p.y)**2;
                            if (dSq < closestDistSq && !p.pinned && !grabbedNodes.includes(p)) {
                                closestDistSq = dSq;
                                target = p;
                            }
                        }
                        if (target) h.grabbedNode = target;
                    }
                    if (h.grabbedNode) {
                        h.grabbedNode.oldX = h.grabbedNode.x;
                        h.grabbedNode.oldY = h.grabbedNode.y;
                        h.grabbedNode.x = h.x;
                        h.grabbedNode.y = h.y;
                        grabbedNodes.push(h.grabbedNode);
                    }
                } else {
                    h.grabbedNode = null;
                }
            }

            // Update each curtain
            let iterations = curtains.length > 4 ? 5 : 12; // Dynamic LOD for physics
            for (let c of curtains) {
                if (c.isFullyRevealed) continue; // Skip physics for revealed curtains (Massive Perf Boost)

                for (let p of grabbedNodes) {
                    if (c.points.includes(p)) {
                        // Only allow throwing up now, not pulling back down
                        if (!c.isThrown && p.y < c.baseY - 20) {
                            c.isThrown = true;
                        }
                    }
                }

                let allPointsOffscreen = true;

                for (let p of c.points) {
                    if (c.isThrown) p.pinned = false; // Tear off the rail!

                    if (!p.pinned && !grabbedNodes.includes(p)) {
                        let vx = (p.x - p.oldX) * FRICTION;
                        let vy = (p.y - p.oldY) * FRICTION;

                        if (p.wasGrabbed) {
                            if (vy < -15) c.isThrown = true;
                        }

                        let targetX = p.origBaseX;
                        let targetY = p.origBaseY;

                        if (c.isThrown) {
                            targetX = p.origBaseX + p.randomOffsetX;
                            targetY = -height * 0.8; // Snap completely off-screen upwards
                        }

                        let restoreForce = c.isThrown ? 0.12 : 0.0015; // Snappier response for tighter layout
                        let restoreX = (targetX - p.x) * restoreForce;
                        let restoreY = (targetY - p.y) * restoreForce;

                        p.oldX = p.x;
                        p.oldY = p.y;
                        p.x += vx + windX + restoreX;
                        p.y += vy + windY + restoreY + GRAVITY;
                    }
                    p.wasGrabbed = grabbedNodes.includes(p);

                    if (p.y > -50) {
                        allPointsOffscreen = false;
                    }
                }

                if (c.isThrown && allPointsOffscreen) {
                    c.isFullyRevealed = true;
                    spawnParticles(c.baseX, c.baseY, c.w, c.h);
                    document.getElementById('reset-btn').style.display = 'flex';
                }

                for (let i = 0; i < iterations; i++) {
                    for (let s of c.sticks) {
                        let dx = s.p2.x - s.p1.x;
                        let dy = s.p2.y - s.p1.y;
                        let distSq = dx * dx + dy * dy;
                        let distance = Math.sqrt(distSq);
                        if(distance === 0) continue;
                        let difference = s.len - distance;
                        let percent = difference / distance / 2;
                        let stiffness = 0.4;
                        let offsetX = dx * percent * stiffness;
                        let offsetY = dy * percent * stiffness;

                        if (!s.p1.pinned && !grabbedNodes.includes(s.p1)) {
                            s.p1.x -= offsetX;
                            s.p1.y -= offsetY;
                        }
                        if (!s.p2.pinned && !grabbedNodes.includes(s.p2)) {
                            s.p2.x += offsetX;
                            s.p2.y += offsetY;
                        }
                    }
                }
            }
        }

        function renderClothVisuals(c) {
            noStroke();
            let baseArea = c.spacingX * c.spacingY;

            // Stress-based 3D Shading
            for (let y = 0; y < c.rows - 1; y++) {
                for (let x = 0; x < c.cols - 1; x++) {
                    let p1 = c.points[y * c.cols + x];
                    let p2 = c.points[y * c.cols + x + 1];
                    let p3 = c.points[(y + 1) * c.cols + x + 1];
                    let p4 = c.points[(y + 1) * c.cols + x];

                    let dx1 = p2.x - p1.x; let dy1 = p2.y - p1.y;
                    let dx2 = p4.x - p1.x; let dy2 = p4.y - p1.y;
                    let currentW = Math.sqrt(dx1*dx1 + dy1*dy1);
                    let currentH = Math.sqrt(dx2*dx2 + dy2*dy2);
                    let ratio = (currentW * currentH) / baseArea;

                    if (ratio < 0.95) {
                        let alpha = map(ratio, 0.5, 0.95, 120, 0);
                        fill(0, 0, 0, constrain(alpha, 0, 120));
                        beginShape();
                        vertex(p1.x, p1.y); vertex(p2.x, p2.y); vertex(p3.x, p3.y); vertex(p4.x, p4.y);
                        endShape(CLOSE);
                    } else if (ratio > 1.05) {
                        let alpha = map(ratio, 1.05, 1.5, 0, 60);
                        fill(255, 255, 255, constrain(alpha, 0, 60));
                        beginShape();
                        vertex(p1.x, p1.y); vertex(p2.x, p2.y); vertex(p3.x, p3.y); vertex(p4.x, p4.y);
                        endShape(CLOSE);
                    }
                }
            }

            // Continuous Liquid Edge
            noFill();
            if (c.perimeter.length > 0) {
                drawingContext.shadowBlur = 0;
                stroke(0, 0, 0, 30);
                strokeWeight(4);
                beginShape();
                for (let i = 0; i < c.perimeter.length + 3; i++) {
                    let p = c.perimeter[i % c.perimeter.length];
                    curveVertex(p.x, p.y);
                }
                endShape();

                if (curtains.length <= 4) { // Disable shadow blur for performance when > 4
                    drawingContext.shadowBlur = 12;
                    drawingContext.shadowColor = 'rgba(255, 255, 255, 0.8)';
                }
                stroke(255, 255, 255, 180);
                strokeWeight(1.5);
                beginShape();
                for (let i = 0; i < c.perimeter.length + 3; i++) {
                    let p = c.perimeter[i % c.perimeter.length];
                    curveVertex(p.x, p.y);
                }
                endShape();
            }

            drawingContext.shadowBlur = 0;
        }

        function renderInteraction() {
            // Visual indicators removed to keep the experience immersive
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            updateMediaDimensions();
        }

        // Prevent scrolling on mobile
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    </script>
</body>
</html>
