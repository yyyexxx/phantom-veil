<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Phantom Veil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="veil-canvas"></canvas>

  <div id="ui-overlay">
    <h1>Phantom Veil</h1>
    <p>Pinch and pull the invisible curtain to reveal what lies beneath.</p>
    <button id="begin-btn">Begin</button>
    <p id="status-msg">Camera access is required for hand tracking.</p>
  </div>

  <div id="debug-info">Initializing...</div>

  <!-- Upload hidden content -->
  <input type="file" id="content-upload" accept="video/*,image/*" style="display:none">
  <button id="btn-upload" class="glass-btn icon-btn" title="Upload Content">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
  </button>

  <div id="key-hints">
    <span class="hint"><kbd>1</kbd>-<kbd>4</kbd> Filter</span>
    <span class="hint"><kbd>G</kbd> Grid</span>
    <span class="hint"><kbd>V</kbd> Veil</span>
    <span class="hint"><kbd>F</kbd> Glass</span>
    <span class="hint"><kbd>R</kbd> Reset</span>
  </div>

  <!-- Control buttons -->
  <div id="btn-hide-ui" class="glass-btn icon-btn" title="Toggle UI">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  </div>

  <div id="controls">
    <button id="btn-reset" class="glass-btn" title="Reset Curtain">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      <span>Reset</span>
    </button>
    <button id="btn-glass" class="glass-btn icon-btn" title="Glass Filter">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M2 12h20"/><path d="M12 2v20"/></svg>
    </button>
    <button id="btn-settings" class="glass-btn icon-btn" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <!-- Settings panel -->
  <div id="settings-panel" class="hidden">
    <div class="settings-section">
      <label class="settings-label">Filter</label>
      <div id="filter-options" class="filter-row">
        <button class="filter-chip active" data-mode="2">Edge</button>
        <button class="filter-chip" data-mode="0">Stress</button>
        <button class="filter-chip" data-mode="1">Wire</button>
        <button class="filter-chip" data-mode="3">Velvet</button>
      </div>
    </div>
    <div class="settings-section">
      <div class="toggle-row">
        <span class="settings-label">Veil</span>
        <button id="toggle-veil" class="toggle-switch on" data-key="veil"></button>
      </div>
      <div class="toggle-row">
        <span class="settings-label">Glass</span>
        <button id="toggle-glass" class="toggle-switch on" data-key="glass"></button>
      </div>
      <div class="toggle-row">
        <span class="settings-label">Grid</span>
        <button id="toggle-grid" class="toggle-switch" data-key="grid"></button>
      </div>
      <div class="toggle-row">
        <span class="settings-label">Auto-Reset</span>
        <button id="toggle-autoreset" class="toggle-switch" data-key="autoreset"></button>
      </div>
    </div>
    <div class="settings-section">
      <label class="settings-label">Volume</label>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="js/main.js" type="module"></script>
</body>
</html>
